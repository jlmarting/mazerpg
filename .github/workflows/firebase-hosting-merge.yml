# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- AQUÍ EMPIEZA LA INYECCION DE SECRETS ---
      - name: Inyectar Secretos en el HTML
        run: |
          sed -i "s/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/g" index.html
          sed -i "s/__FIREBASE_AUTH_DOMAIN__/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" index.html
          sed -i "s/__FIREBASE_PROJECT_ID__/${{ secrets.FIREBASE_PROJECT_ID }}/g" index.html
          sed -i "s/__FIREBASE_STORAGE_BUCKET__/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" index.html
          sed -i "s/__FIREBASE_MESSAGING_SENDER_ID__/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" index.html
          sed -i "s/__FIREBASE_APP_ID__/${{ secrets.FIREBASE_APP_ID }}/g" index.html
      # --- AQUÍ TERMINA LO NUESTRO ---
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # --- DESPLIEGUE DE REGLAS DE FIRESTORE (Fase 2) ---
      # Usa el Node 20 ya configurado arriba. El secret de la SA se escribe en
      # $RUNNER_TEMP con heredoc (nunca se imprime al log) y la CLI lo consume
      # vía GOOGLE_APPLICATION_CREDENTIALS. Reglas versionadas en firestore.rules.
      # CLI pineada a v13: 'latest' puede exigir Node >= 22 y el corredor usa
      # Node 20 (la v13 es la última compatible con 20).
      - name: Desplegar reglas de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/gcp-sa.json"
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAZERPG_B2AA4 }}
          EOF
          npx -y firebase-tools@13 deploy --only firestore:rules --project mazerpg-b2aa4 --json --force || (echo '::error::Fallo despliegue de reglas — si es permisos de la SA (rol Firebase Rules), concedelo en consola IAM o despliega manualmente'; exit 1)
      # Limpieza del secret en paso separado: se ejecuta SIEMPRE (éxito o fallo
      # del despliegue) para que el fichero no sobreviva al fallo del trabajo.
      - name: Limpiar secret temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAZERPG_B2AA4 }}
          channelId: live
          projectId: mazerpg-b2aa4
