# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- AQUÍ EMPIEZA LO NUESTRO ---
      - name: Inyectar Secretos en el HTML
        run: |
          sed -i "s/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/g" index.html
          sed -i "s/__FIREBASE_AUTH_DOMAIN__/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" index.html
          sed -i "s/__FIREBASE_PROJECT_ID__/${{ secrets.FIREBASE_PROJECT_ID }}/g" index.html
          sed -i "s/__FIREBASE_STORAGE_BUCKET__/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" index.html
          sed -i "s/__FIREBASE_MESSAGING_SENDER_ID__/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" index.html
          sed -i "s/__FIREBASE_APP_ID__/${{ secrets.FIREBASE_APP_ID }}/g" index.html
      # --- AQUÍ TERMINA LO NUESTRO ---
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # --- DESPLIEGUE DE REGLAS DE FIRESTORE (Fase 2) ---
      # Usa el Node 20 ya configurado arriba. OJO: las reglas son GLOBALES del
      # proyecto mazerpg-b2aa4: el despliegue desde un PR afecta a todos los
      # entornos (los previews son sólo de Hosting). El secret de la SA se
      # escribe en $RUNNER_TEMP con heredoc (nunca se imprime al log) y la CLI
      # lo consume vía GOOGLE_APPLICATION_CREDENTIALS.
      - name: Desplegar reglas de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/gcp-sa.json"
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAZERPG_B2AA4 }}
          EOF
          npx -y firebase-tools@latest deploy --only firestore:rules --project mazerpg-b2aa4 --json --force || (echo '::error::Fallo despliegue de reglas — si es permisos de la SA (rol Firebase Rules), concedelo en consola IAM o despliega manualmente'; exit 1)
          rm -f "$RUNNER_TEMP/gcp-sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAZERPG_B2AA4 }}
          projectId: mazerpg-b2aa4
