<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structor - Sprite Mapping Tool</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; min-width: 300px; max-width: 450px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; overflow-y: auto; height: 100vh; scrollbar-width: thin; scrollbar-color: #007bff #1e1e1e; }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1e1e1e; }
        #sidebar::-webkit-scrollbar-thumb { background-color: #333; border-radius: 10px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background-color: #007bff; }

        /* Panel de JSON Desplegable */
        #jsonPanel { position: absolute; top: 0; left: 350px; width: 0; height: 100vh; background: #181818; z-index: 150; transition: width 0.3s ease; overflow: visible; display: flex; flex-direction: column; box-sizing: border-box; }
        #jsonPanel.open { width: 400px; border-right: 1px solid #333; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        #jsonPanelToggle { position: absolute; top: 20px; left: 0; width: 30px; height: 80px; background: #007bff; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 10px; font-weight: bold; writing-mode: vertical-rl; text-orientation: mixed; box-shadow: 5px 0 10px rgba(0,0,0,0.3); z-index: 160; }
        #jsonPanelContent { display: none; width: 400px; height: 100vh; flex-direction: column; padding: 15px; box-sizing: border-box; overflow: hidden; }
        #jsonPanel.open #jsonPanelContent { display: flex; }

        #viewer { flex: 1; position: relative; overflow: auto; background: #000; display: flex; align-items: flex-start; justify-content: flex-start; cursor: crosshair; height: 100vh; }

        h1 { font-size: 18px; color: #007bff; margin: 0 0 15px 0; flex-shrink: 0; }
        .group { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 15px; flex-shrink: 0; }
        .group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .group input, .group select { width: 100%; padding: 8px; background: #2d2d2d; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 4px; }

        .coords-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        #canvasContainer { position: relative; transform-origin: top left; }
        .selection-box { position: absolute; border: 2px solid #00ff00; background: rgba(0, 255, 0, 0.2); pointer-events: none; box-shadow: 0 0 10px rgba(0,255,0,0.5); }
        .selection-box.active { border-color: #ffff00; background: rgba(255, 255, 0, 0.3); }
        .selection-box::after { content: attr(data-index); position: absolute; top: -15px; left: 0; background: #000; color: #0f0; font-size: 10px; padding: 0 2px; }

        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: monospace; transition: background 0.2s; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #444; color: #fff; margin-top: 10px; }

        #output { height: 150px; min-height: 100px; margin-top: 10px; background: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; font-size: 11px; padding: 10px; border-radius: 4px; border: 1px solid #333; overflow: auto; white-space: pre; width: 100%; box-sizing: border-box; resize: vertical; flex-shrink: 0; }

        .preview-area { width: 100%; height: 120px; min-height: 100px; background: #000; border: 1px dashed #555; margin-top: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; flex-shrink: 0; }
        #previewCanvas { image-rendering: pixelated; transform: scale(2); }
        .anim-controls { width: 100%; display: flex; gap: 5px; padding: 5px; background: rgba(0,0,0,0.5); position: absolute; bottom: 0; box-sizing: border-box; }

        .toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 100; }
        .tool-btn { background: rgba(30, 30, 30, 0.8); color: white; border: 1px solid #555; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        #gridOverlay { position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0.3; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>STRUCTOR v1.0</h1>

        <div class="group">
            <label>HOJA DE SPRITES (SERVIDOR):</label>
            <select id="sheetSelect">
                <option value="">-- Seleccionar hoja --</option>
            </select>
            <label style="margin-top:10px;">O CARGAR ARCHIVO LOCAL:</label>
            <input type="file" id="fileInput" accept="image/*">
            <button class="btn btn-secondary" id="btnLoadDemo">USAR DEMO SHEET</button>
        </div>

        <div class="group">
            <label>PROPIEDADES DE SELECCIÓN:</label>
            <div class="coords-grid">
                <div><label>X:</label><input type="number" id="boxX" value="0"></div>
                <div><label>Y:</label><input type="number" id="boxY" value="0"></div>
                <div><label>ANCHO:</label><input type="number" id="boxW" value="32"></div>
                <div><label>ALTO:</label><input type="number" id="boxH" value="32"></div>
            </div>
        </div>

        <div class="group">
            <label>ASIGNACIÓN LÓGICA (OBJETIVO):</label>
            <select id="catSelect"></select>
            <select id="claseSelect" style="margin-top:5px;"></select>
            <select id="accionSelect" style="margin-top:5px;"></select>
            <div id="frameInfo" style="font-size: 10px; color: #aaa; margin-top: 5px;">Frames asignados: 0</div>
        </div>

        <div class="group">
            <label>HERRAMIENTA DE CLONADO:</label>
            <div style="display: flex; gap: 5px;">
                <select id="cloneCatSelect" style="flex: 1; font-size: 10px;"></select>
                <select id="cloneClaseSelect" style="flex: 1; font-size: 10px;"></select>
            </div>
            <button class="btn btn-secondary" id="btnClone" style="width: 100%; font-size: 11px; background: #555;">CLONAR ACCIONES DESDE ORIGEN</button>
        </div>

        <div class="group" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="margin-bottom: 0;">SIMULACIÓN DE ANIMACIÓN:</label>
                <button class="tool-btn" id="btnToggleLive" style="background: #e67e22; color: white; font-size: 9px; padding: 2px 8px;">MODO PRUEBA (LIVE)</button>
            </div>
            <div class="preview-area">
                <canvas id="previewCanvas" width="64" height="64"></canvas>
                <div class="anim-controls">
                    <button class="tool-btn" id="btnPlayAnim" style="padding: 2px 5px; font-size: 9px;">PLAY</button>
                    <button class="tool-btn" id="btnOpenLargePreview" style="padding: 2px 5px; font-size: 9px;">GRANDE</button>
                    <input type="range" id="animSpeed" min="50" max="1000" value="200" style="flex: 1;">
                    <span id="speedVal" style="font-size: 9px; width: 30px;">200ms</span>
                </div>
            </div>

            <div style="display: flex; gap: 5px;">
                <button class="btn btn-primary" id="btnExport" style="margin-top: 10px; flex: 1;">GUARDAR ACCIÓN</button>
            </div>
            <div style="display: flex; gap: 5px;">
                <button class="btn btn-secondary" id="btnResetCanvas" style="margin-top: 5px; flex: 1; font-size: 10px;">LIMPIAR CANVAS</button>
                <button class="btn btn-secondary" id="btnClearAnim" style="margin-top: 5px; flex: 1; font-size: 10px; background: #822;">ELIMINAR MAPEO</button>
            </div>
        </div>

        <!-- El Panel JSON ahora vive aquí pero se posiciona absolutamente -->
        <div id="jsonPanel">
            <div id="jsonPanelToggle">METADATOS JSON</div>
            <div id="jsonPanelContent">
                <label style="color: #007bff; font-weight: bold; margin-bottom: 10px; display: block;">MAPEO DE SPRITES (JSON)</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button class="btn btn-primary" id="btnCopyJson" style="flex: 1; font-size: 11px;">COPIAR AL PORTAPAPELES</button>
                    <button class="btn btn-secondary" id="btnPasteJson" style="flex: 1; font-size: 11px; margin-top:0;">PEGAR JSON</button>
                </div>
                <textarea id="output" spellcheck="false" style="flex: 1; height: auto; min-height: 0; margin-top: 0;"></textarea>
                <p style="font-size: 10px; color: #666; margin-top: 10px;">Los cambios manuales en este JSON se reflejan inmediatamente en el editor y la simulación.</p>
            </div>
        </div>
    </div>

    <div id="viewer">
        <div class="toolbar">
            <button class="tool-btn" id="btnToggleGrid">GRILLA ON/OFF</button>
            <button class="tool-btn" id="btnZoomIn">ZOOM +</button>
            <button class="tool-btn" id="btnZoomOut">ZOOM -</button>
            <button class="tool-btn" id="btnResetZoom">1:1</button>
        </div>
        <div id="canvasContainer">
            <canvas id="spriteCanvas"></canvas>
            <canvas id="gridOverlay"></canvas>
            <div id="selectionBoxesContainer"></div>
        </div>
    </div>

    <!-- Modal de Previsualización Grande -->
    <div id="largePreviewModal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #111; border: 2px solid #007bff; padding: 40px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <h2 style="color: #007bff; margin: 0;">SIMULACIÓN AMPLIADA</h2>
            <div style="background: #000; border: 1px solid #333; width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <canvas id="largePreviewCanvas" width="300" height="300" style="image-rendering: pixelated;"></canvas>
            </div>
            <div style="display: flex; gap: 20px; align-items: center; width: 100%;">
                <label style="font-size: 14px; color: #888;">CICLO (ms):</label>
                <input type="range" id="modalAnimSpeed" min="50" max="1000" value="200" style="flex: 1;">
                <span id="modalSpeedVal" style="font-family: monospace; color: #0f0;">200ms</span>
            </div>
            <button class="btn btn-primary" id="btnCloseLargePreview" style="width: 100%;">CERRAR PREVIEW</button>
        </div>
    </div>

    <!-- Modal de Sala de Simulación -->
    <div id="simRoomModal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000;">
        <div style="background: #1a1a1a; border: 2px solid #e67e22; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; max-width: 90vw;">
            <h2 style="color: #e67e22; margin: 0; font-size: 18px;">SALA DE SIMULACIÓN (12x10)</h2>
            <div style="background: #000; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
                <canvas id="simCanvas" width="384" height="320" style="image-rendering: pixelated; display: block;"></canvas>
            </div>
            <div style="color: #888; font-size: 11px; text-align: center; font-family: monospace;">
                Usa las <b>FLECHAS</b> para moverte | <b>ESPACIO</b> para atacar<br>
                Prueba colisiones y estados en tiempo real.
            </div>
            <button class="btn btn-primary" id="btnCloseSim" style="width: 100%; background: #e67e22;">VOLVER AL EDITOR</button>
        </div>
    </div>

    <script type="module" src="/src/tools/structor.ts"></script>
</body>
</html>
